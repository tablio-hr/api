name: PR CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PR CI / backend
    runs-on: [self-hosted, linux, x64, tablio, docker]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
        shell: bash
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tablio
          POSTGRES_PASSWORD: tablio
          POSTGRES_DB: tablio_platform_test_db
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tablio -d tablio_platform_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DB_HOST: localhost
      DB_PORT: "55432"
      DB_NAME: tablio_platform_test_db
      DB_USER: tablio
      DB_PASSWORD: tablio
      DJANGO_ALLOWED_HOSTS: "testserver,localhost,127.0.0.1,tablio-django,admin.tablio.hr,admin-stage.tablio.hr,api.tablio.hr,api-stage.tablio.hr"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        working-directory: .
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Test matrix
        run: python manage.py test -v 2
